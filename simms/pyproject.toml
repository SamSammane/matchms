[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "simms"
version = "0.2.0"
description = "Agent-friendly CLI for simulated mass spectrometry test data: generation, mutation, merging and pipelines built on matchms, MassBank data and (optionally) OpenMS TOPP tools."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenMS/matchms tooling" }]
dependencies = [
    "numpy",
    "matchms>=0.24",
    "psims>=1.2",
    "pyteomics>=4.6",
    "PyYAML>=5.4",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
simms = "simms.cli:main"

[tool.setuptools.packages.find]
include = ["simms*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
